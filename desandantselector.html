<!DOCTYPE html>
<html>
    <head>
        <title>Group/ Decendant selector</title>
        <link rel="stylesheet" href="./Decendantselector.css">
    </head>
    <body>
        <h1> group selector / decendant selector</h1>

        <div class="container">
            <p>first paragraph </p>
            <h1> first heading</h1>
            <div class="child-first-container">
                <p> first child container</p>
            </div>
        </div>

        <div class="second-container">
            <p>second container</p>
            <h2> second child container</h2>
            <div class="second child container">
                <p> second child container</p>
                <h2> second child first container</h2>
                <div>
                    <h2> In Depth second child container</h2>
                </div>
            </div>
        </div>

    </body>
</html>
