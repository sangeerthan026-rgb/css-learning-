<!DOCTYPE html>
<html>
    <head>
        <title>
            Group/Decendant selector
        </title>
        <link rel="stylesheet" href="gs-decendantselector.css">
    </head>
    <body>
        <h1>Group Selector/Descendant selector</h1>
        <div class="container1">
            <p>First paragraph</p>
        <h1>First heading </h1>
            <div class="child-first-container">
                <p>first child container</p>
            </div>
        </div>
        <div class="container2">
            <p>Second container</p>
            <h2>Second child container</h2>
            <div class="second-child-first-container">
                <p>Second child container</p>
                <h2>Second child first container</h2>
                <div>
                    <h2>In Depth second child container</h2>
                </div>
            </div>
        </div>
    </body>
</html>
